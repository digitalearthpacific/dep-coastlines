name: PR Checks

on:
  pull_request:
    branches: [main, release/next]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The hooks install their own environments, so the project itself
      # does not need to be installed for this job
      - name: Run pre-commit
        run: uvx pre-commit run --all-files --show-diff-on-failure

  type-check:
    runs-on: ubuntu-latest
    # Same base image as the Dockerfile, so the gdal package can build
    # against the matching GDAL library
    container: ghcr.io/osgeo/gdal:ubuntu-full-3.12.4
    steps:
      # Same apt packages as the Dockerfile
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y git python3-dev build-essential
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        # Use the image's Python 3.12; numba has no 3.14 support
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --no-install-package pygeos
      # Report only until the existing type errors are fixed
      - name: Run pyright
        run: uv run pyright
        continue-on-error: true
